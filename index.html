<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Moodie" />
    <meta name="description" content="영화를 평가하고 추천과 리스트를 관리하는 앱" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Moodie</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f7f7fb;
        color: #15171c;
        font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-boot-main {
        box-sizing: border-box;
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        padding: 2rem 1rem 7rem;
      }

      .app-boot-card {
        display: flex;
        min-height: 420px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(0 0 0 / 5%);
        border-radius: 28px;
        background: #fff;
      }

      .app-boot-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgb(216 180 254 / 45%);
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="app-boot-main" aria-label="화면을 불러오는 중" aria-busy="true">
        <section class="app-boot-card">
          <span class="app-boot-spinner" aria-hidden="true"></span>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
